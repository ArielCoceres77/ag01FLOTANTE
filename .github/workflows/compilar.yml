name: Compilar AG1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Kit de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Base de conocimiento
        run: python3 herramientas/armar_conocimiento.py
      - name: Compilar APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|FAILURE|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - run: cp android/app/build/outputs/apk/release/app-release.apk AG1.apk
      - uses: actions/upload-artifact@v4
        with: { name: AG1-Android, path: AG1.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Base de conocimiento
        run: python herramientas/armar_conocimiento.py
      - name: Empaquetar
        working-directory: escritorio
        shell: pwsh
        run: |
          if (Test-Path web) { Remove-Item -Recurse -Force web }
          Copy-Item -Recurse ../web web
          npm install --no-audit --no-fund
          npx electron-packager . AG1 --platform=win32 --arch=x64 --icon=icono.ico --out=dist --asar --overwrite --app-copyright="Copyleft Adustiones Libertarias"
          Copy-Item ../LEEME.txt dist/AG1-win32-x64/
          Compress-Archive -Path dist/AG1-win32-x64 -DestinationPath ../AG1-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: AG1-Windows, path: AG1-Windows.zip }

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AG1 v1.0.${{ github.run_number }}
          body: "AG1 flotante: APK para Android y zip para Windows."
          files: |
            AG1.apk
            AG1-Windows.zip
